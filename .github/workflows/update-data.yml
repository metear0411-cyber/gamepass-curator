name: 데이터 갱신

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 한국 시간 새벽 3시
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    # 로컬 개발 환경(Windows PowerShell 5.1)과 똑같이 돌리려고 Windows 러너를 쓴다
    runs-on: windows-latest
    env:
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      # 한 번 검색한 게임은 다시 검색하지 않도록 네이버 검색 결과를 캐시한다
      - uses: actions/cache@v4
        with:
          path: data/naver-cache
          key: naver-cache-${{ github.run_id }}
          restore-keys: naver-cache-

      - name: 게임패스 카탈로그 수집
        shell: powershell
        run: ./scripts/build-data.ps1

      - name: 한글패치 검색 (NAVER API 키가 있을 때만)
        if: env.NAVER_CLIENT_ID != ''
        shell: powershell
        run: |
          ./scripts/search-korean-patch.ps1
          ./scripts/build-data.ps1

      - name: 바뀐 데이터 커밋
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음"
          else
            git commit -m "데이터 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
